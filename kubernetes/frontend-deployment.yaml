apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 659364970402.dkr.ecr.ap-south-1.amazonaws.com/frontend:latest

          env:
            - name: VITE_BACKEND_URL
              value: "http://smartnotes:5000/api"
          ports:
            - containerPort: 3000
